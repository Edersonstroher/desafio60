<!DOCTYPE html>
<html lang="pt-BR" data-tema="dark" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Minhas competições — Desafio 60</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0F0E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<div class="app-shell">
  <nav class="side-nav">
    <div class="brand" style="margin-bottom:20px;"><img src="assets/logo.svg" alt="Desafio 60" class="trophy" style="width:22px; height:22px;"> <strong>DESAFIO 60</strong></div>
    <a href="dashboard.html" data-nav="dashboard">🏠 Início</a>
    <a href="pesagem.html" data-nav="pesagem">⚖️ Registrar peso</a>
    <a href="ranking.html" data-nav="ranking">🏆 Ranking</a>
    <a href="competicao.html" data-nav="competicao" class="active">🗂️ Minhas competições</a>
    <a href="regras.html" data-nav="regras">📜 Regras</a>
    <a href="perfil.html" data-nav="perfil">👤 Perfil</a>
  </nav>

  <main>
    <div class="topbar">
      <a href="dashboard.html" class="icon-btn">←</a>
      <div class="brand"><strong>Minhas competições</strong></div>
      <a href="join.html" class="icon-btn">+</a>
    </div>

    <div class="container">
      <div id="lista"></div>
      <a href="join.html" class="btn btn-ghost" style="margin-top:12px;">+ Entrar com código de convite</a>
    </div>
  </main>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html" data-nav="dashboard"><span class="ic">🏠</span>Início</a>
  <a href="ranking.html" data-nav="ranking"><span class="ic">🏆</span>Ranking</a>
  <a href="pesagem.html" data-nav="pesagem"><span class="ic">⚖️</span>Pesar</a>
  <a href="perfil.html" data-nav="perfil"><span class="ic">👤</span>Perfil</a>
</nav>

<script type="module">
  import { requireAuth } from './js/services/auth.js';
  import { getMyCompetitions, definirCompeticaoAtiva } from './js/services/competition.js';
  import { aplicarTema, temaSalvoLocalmente, marcarNavAtiva, mostrarToast , registrarServiceWorker } from './js/app.js';

  aplicarTema(temaSalvoLocalmente());
  registrarServiceWorker();
  marcarNavAtiva('competicao');

  const user = await requireAuth();
  if (!user) throw new Error('não autenticado');

  const tagPorStatus = {
    ACTIVE: '<span class="tag tag-active">Ativa</span>',
    WAITING: '<span class="tag tag-waiting">Aguardando</span>',
    FINISHED: '<span class="tag tag-finished">Finalizada</span>',
    DRAFT: '<span class="tag tag-draft">Rascunho</span>',
    CANCELLED: '<span class="tag tag-finished">Cancelada</span>',
  };

  try {
    const minhas = await getMyCompetitions();
    const ativasSimultaneas = minhas.filter((m) => m.competitions.status === 'ACTIVE').length > 1;
    const idAtivaSalva = localStorage.getItem('desafio60_competicao_ativa_id');

    document.getElementById('lista').innerHTML = minhas.length
      ? minhas.map((m) => {
          const ehAtivaSelecionada = m.competitions.status === 'ACTIVE' && (idAtivaSalva ? m.competition_id === idAtivaSalva : true);
          const mostrarSeletor = ativasSimultaneas && m.competitions.status === 'ACTIVE';
          return `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
              <h3 style="font-size:16px; font-family:var(--font-display);">🏆 ${m.competitions.nome}</h3>
              ${tagPorStatus[m.competitions.status] || ''}
            </div>
            <p style="font-size:13px; color:var(--text-muted); margin:0 0 12px;">${m.competitions.descricao || ''}</p>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <a href="dashboard.html" class="btn btn-ghost" style="width:auto; padding:8px 16px; font-size:12px;">Ver desempenho</a>
              ${mostrarSeletor ? `<button class="btn ${ehAtivaSelecionada ? 'btn-primary' : 'btn-ghost'}" style="width:auto; padding:8px 16px; font-size:12px;" data-definir-ativa="${m.competition_id}" ${ehAtivaSelecionada ? 'disabled' : ''}>${ehAtivaSelecionada ? '✓ Competição em uso' : 'Usar esta no app'}</button>` : ''}
            </div>
          </div>`;
        }).join('')
      : '<div class="empty-state"><div class="ic">🏆</div><p>Você ainda não participa de nenhuma competição.</p></div>';

    document.querySelectorAll('[data-definir-ativa]').forEach((btnEl) => {
      btnEl.addEventListener('click', () => {
        definirCompeticaoAtiva(btnEl.dataset.definirAtiva);
        mostrarToast('Competição definida! O app vai usar essa a partir de agora.', 'success');
        setTimeout(() => window.location.reload(), 700);
      });
    });
  } catch (err) {
    mostrarToast('Não foi possível carregar suas competições.', 'error');
    console.error(err);
  }
</script>
</body>
</html>
